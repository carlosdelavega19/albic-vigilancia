# GitHub apaga las tareas programadas de un repositorio público si pasan 60
# días sin actividad. Una vez al mes se apunta la fecha en ULTIMA-REVISION.txt
# para que la vigilancia no se detenga nunca.
name: Mantener la vigilancia

on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apuntar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apuntar la fecha
        run: |
          date -u '+%Y-%m-%d %H:%M UTC' > ULTIMA-REVISION.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ULTIMA-REVISION.txt
          git commit -m 'Revisión mensual de la vigilancia' || exit 0
          git push
